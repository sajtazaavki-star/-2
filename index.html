<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вязалочка PRO — Монетизация и Подписки</title>
    
    <!-- Подключение библиотек с надежных CDN -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap');
        
        body { 
            background-color: #fff1f2; 
            font-family: 'Nunito', sans-serif; 
            touch-action: manipulation;
            overscroll-behavior: none;
            margin: 0;
        }

        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }

        .mic-active {
            animation: pulse-rose 1.5s infinite;
            background-color: #e11d48 !important;
            color: white !important;
        }

        @keyframes pulse-rose {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }

        .timer-blink { animation: blink 2s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        ::-webkit-scrollbar { width: 0px; }

        .card-anim { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pop-up {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: #e11d48;
            color: white;
            padding: 12px 30px;
            border-radius: 99px;
            font-weight: 900;
            box-shadow: 0 10px 25px rgba(225, 29, 72, 0.3);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icons = {
            Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Mic: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>,
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            TrashMini: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Play: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Pause: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>,
            Check: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Music: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>,
            Loop: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>,
            SkipForward: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" strokeWidth="3" strokeLinecap="round"></line></svg>,
            SkipBack: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" strokeWidth="3" strokeLinecap="round"></line></svg>,
            Clock: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
            Crown: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7z"></path><circle cx="12" cy="19" r="1"></circle></svg>,
            Sparkles: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>,
            Calculator: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><path d="M16 10h.01"></path><path d="M12 10h.01"></path><path d="M8 10h.01"></path><path d="M12 14h.01"></path><path d="M8 14h.01"></path><path d="M12 18h.01"></path><path d="M8 18h.01"></path></svg>
        };

        const CATEGORIES = [
            { id: 'socks', label: 'Носки', icon: '🧦' },
            { id: 'hats', label: 'Шапки', icon: '🧶' },
            { id: 'shawl', label: 'Шаль', icon: '🧣' },
            { id: 'clothing', label: 'Одежда', icon: '🧥' },
            { id: 'other', label: 'Разное', icon: '✨' },
        ];

        const ALLOWED_FORMATS = "audio/*,video/*,.mp3,.wav,.m4a,.aac,.ogg,.mp4,.mov,.mkv,.avi,.3gp,audio/mpeg,audio/mp3,audio/wav,audio/x-m4a,video/mp4";

        const App = () => {
            const [projects, setProjects] = useState(() => {
                try {
                    const saved = localStorage.getItem('knit_app_final_v14');
                    const parsed = saved ? JSON.parse(saved) : [];
                    return parsed.map(p => ({
                        ...p,
                        timeSpent: p.timeSpent || 0,
                        isTimerRunning: p.isTimerRunning || false,
                        counters: (p.counters || []).map(c => ({
                            ...c,
                            timeSpent: c.timeSpent || 0,
                            isTimerRunning: c.isTimerRunning || false
                        }))
                    }));
                } catch(e) {
                    return [];
                }
            });

            const [completedProjects, setCompletedProjects] = useState(() => {
                try {
                    const saved = localStorage.getItem('knit_app_completed_v14');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) {
                    return [];
                }
            });
            
            const [proStatus, setProStatus] = useState(() => {
                try {
                    const saved = localStorage.getItem('knit_app_pro_status');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.expiresAt && Date.now() > parsed.expiresAt) {
                            return { isPro: false, expiresAt: null, plan: null };
                        }
                        return parsed;
                    }
                } catch(e) {}
                return { isPro: false, expiresAt: null, plan: null };
            });

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [newProjName, setNewProjName] = useState('');
            const [newProjCat, setNewProjCat] = useState('socks');
            
            const [isProModalOpen, setIsProModalOpen] = useState(false);
            const [isArchiveModalOpen, setIsArchiveModalOpen] = useState(false);
            const [isGaugeModalOpen, setIsGaugeModalOpen] = useState(false);
            const [isListening, setIsListening] = useState(false);
            const [feedback, setFeedback] = useState('');
            
            const [isPlayerOpen, setIsPlayerOpen] = useState(false);
            const [playlist, setPlaylist] = useState([]);
            const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [loopMode, setLoopMode] = useState('none');
            
            // Состояние калькулятора плотности вязания
            const [gaugeWidthSample, setGaugeWidthSample] = useState(10); // см связанного образца
            const [gaugeStitchesSample, setGaugeStitchesSample] = useState(20); // петель в образце
            const [gaugeHeightSample, setGaugeHeightSample] = useState(10); // см в высоту
            const [gaugeRowsSample, setGaugeRowsSample] = useState(28); // рядов в образце
            const [desiredWidth, setDesiredWidth] = useState(50); // желаемая ширина изделия (см)
            const [desiredHeight, setDesiredHeight] = useState(60); // желаемая высота изделия (см)

            const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', onConfirm: null });

            const audioRef = useRef(null);
            const projectsRef = useRef(projects);
            const isListeningRef = useRef(isListening);

            useEffect(() => { 
                projectsRef.current = projects; 
                try {
                    localStorage.setItem('knit_app_final_v14', JSON.stringify(projects));
                } catch(e) {}
            }, [projects]);

            useEffect(() => {
                try {
                    localStorage.setItem('knit_app_completed_v14', JSON.stringify(completedProjects));
                } catch(e) {}
            }, [completedProjects]);

            useEffect(() => {
                try {
                    localStorage.setItem('knit_app_pro_status', JSON.stringify(proStatus));
                } catch(e) {}
            }, [proStatus]);

            useEffect(() => { isListeningRef.current = isListening; }, [isListening]);

            // Таймеры проектов
            useEffect(() => {
                const interval = setInterval(() => {
                    setProjects(prev => prev.map(p => {
                        let updated = { ...p };
                        
                        // Проверяем, запущен ли общий таймер или хотя бы один таймер детали
                        const isAnyPartTimerRunning = p.counters.some(c => c.isTimerRunning && !c.isFinished);
                        
                        if (p.isTimerRunning || isAnyPartTimerRunning) {
                            updated.timeSpent = (p.timeSpent || 0) + 1;
                        }

                        updated.counters = p.counters.map(c => {
                            if (c.isTimerRunning && !c.isFinished) {
                                return { ...c, timeSpent: (c.timeSpent || 0) + 1 };
                            }
                            return c;
                        });
                        return updated;
                    }));
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            const showConfirm = (title, onConfirmAction) => {
                setConfirmModal({
                    isOpen: true,
                    title,
                    onConfirm: () => {
                        onConfirmAction();
                        setConfirmModal({ isOpen: false, title: '', onConfirm: null });
                    }
                });
            };

            const handleTrackEnded = () => {
                if (playlist.length === 0) return;
                if (loopMode === 'one') {
                    if (audioRef.current) {
                        audioRef.current.currentTime = 0;
                        audioRef.current.play().catch(e => console.log(e));
                    }
                } else if (loopMode === 'all') {
                    const nextIndex = (currentTrackIndex + 1) % playlist.length;
                    playTrack(nextIndex);
                } else {
                    const nextIndex = currentTrackIndex + 1;
                    if (nextIndex < playlist.length) {
                        playTrack(nextIndex);
                    } else {
                        setIsPlaying(false);
                    }
                }
            };

            const playTrack = (index) => {
                if (playlist.length === 0 || !playlist[index]) return;
                setCurrentTrackIndex(index);
                setIsPlaying(true);
                setTimeout(() => {
                    if (audioRef.current) {
                        audioRef.current.src = playlist[index].url;
                        audioRef.current.play().catch(err => console.log(err));
                    }
                }, 50);
            };

            const skipForward = () => {
                if (playlist.length === 0) return;
                const nextIndex = (currentTrackIndex + 1) % playlist.length;
                playTrack(nextIndex);
            };

            const skipBackward = () => {
                if (playlist.length === 0) return;
                const prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
                playTrack(prevIndex);
            };

            const removeTrack = (id, index) => {
                setPlaylist(prev => {
                    const updated = prev.filter(t => t.id !== id);
                    if (currentTrackIndex === index) {
                        if (updated.length === 0) {
                            setIsPlaying(false);
                            if (audioRef.current) audioRef.current.src = "";
                        } else {
                            const nextIdx = index >= updated.length ? 0 : index;
                            setCurrentTrackIndex(nextIdx);
                            setTimeout(() => {
                                if (audioRef.current && updated[nextIdx]) {
                                    audioRef.current.src = updated[nextIdx].url;
                                    if (isPlaying) audioRef.current.play().catch(e => console.log(e));
                                }
                            }, 50);
                        }
                    } else if (index < currentTrackIndex) {
                        setCurrentTrackIndex(currentTrackIndex - 1);
                    }
                    return updated;
                });
            };

            // Голосовое управление (доступно только в PRO)
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return;
                const rec = new SpeechRecognition();
                rec.continuous = true;
                rec.lang = 'ru-RU';

                rec.onresult = (e) => {
                    if (!proStatus.isPro) return;
                    const text = e.results[e.results.length - 1][0].transcript.toLowerCase();
                    const trigger = ['дальше', 'плюс', 'ряд', 'еще', 'ещё', 'добавь'].some(k => text.includes(k));
                    
                    if (trigger) {
                        const activeProject = projectsRef.current.find(p => p.counters.some(c => !c.isFinished));
                        if (activeProject) {
                            const activeCounters = activeProject.counters.filter(c => !c.isFinished);
                            const targetC = activeCounters[activeCounters.length - 1];
                            if (targetC) {
                                updateCount(activeProject.id, targetC.id, 1);
                                setFeedback('+1 ряд!');
                                setTimeout(() => setFeedback(''), 1500);
                            }
                        }
                    }
                };
                rec.onend = () => { if (isListeningRef.current && proStatus.isPro) try { rec.start(); } catch(e) {} };
                window.recognition = rec;
            }, [proStatus.isPro]);

            const toggleMic = () => {
                if (!proStatus.isPro) {
                    setIsProModalOpen(true);
                    return;
                }
                if (!window.recognition) {
                    setFeedback('Голосовой ввод не поддерживается');
                    setTimeout(() => setFeedback(''), 2000);
                    return;
                }
                if (isListening) { 
                    try { window.recognition.stop(); } catch(e){} 
                    setIsListening(false); 
                } else { 
                    try { window.recognition.start(); } catch(e){} 
                    setIsListening(true); 
                }
            };

            const updateCount = (pid, cid, delta) => {
                setProjects(prev => prev.map(p => {
                    if (p.id === pid) {
                        const newC = p.counters.map(c => {
                            if (c.id === cid) {
                                const val = Math.max(0, c.count + delta);
                                if (delta > 0 && val > 0 && val % 10 === 0 && typeof confetti === 'function') {
                                    confetti({ particleCount: 20, origin: { y: 0.8 } });
                                }
                                return { ...c, count: val };
                            }
                            return c;
                        });
                        return { ...p, counters: newC };
                    }
                    return p;
                }));
            };

            const finishCounter = (pid, cid) => {
                setProjects(prev => prev.map(p => {
                    if (p.id === pid) {
                        return { ...p, counters: p.counters.map(c => c.id === cid ? { ...c, isFinished: true, isTimerRunning: false } : c) };
                    }
                    return p;
                }));
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 40, spread: 70, origin: { y: 0.8 } });
                }
            };

            const deletePart = (pid, cid) => {
                showConfirm("Вы уверены, что хотите удалить эту деталь?", () => {
                    setProjects(prev => prev.map(p => {
                        if (p.id === pid) {
                            return {
                                ...p,
                                counters: p.counters.filter(c => c.id !== cid)
                            };
                        }
                        return p;
                    }));
                });
            };

            const addProject = () => {
                if (!newProjName.trim()) return;
                if (!proStatus.isPro && projects.length >= 2) {
                    setIsModalOpen(false);
                    setIsProModalOpen(true);
                    return;
                }

                const newP = {
                    id: Date.now(),
                    name: newProjName.trim(),
                    category: newProjCat,
                    timeSpent: 0,
                    isTimerRunning: false,
                    counters: [{ id: Date.now(), name: 'Основной этап', count: 0, isFinished: false, timeSpent: 0, isTimerRunning: false }]
                };
                setProjects(prev => [newP, ...prev]);
                setNewProjName('');
                setIsModalOpen(false);
            };

            const addPart = (pid, name) => {
                if (!name.trim()) return;
                setProjects(prev => prev.map(p => 
                    p.id === pid ? { ...p, counters: [...p.counters, { id: Date.now(), name: name.trim(), count: 0, isFinished: false, timeSpent: 0, isTimerRunning: false }] } : p
                ));
            };

            const deleteP = (id) => {
                showConfirm("Удалить проект целиком со всеми деталями?", () => {
                    setProjects(prev => prev.filter(p => p.id !== id));
                });
            };

            const finishProject = (pid) => {
                const project = projects.find(p => p.id === pid);
                if (!project) return;
                
                showConfirm(`Завершить проект «${project.name}» и перенести в архив?`, () => {
                    const finishedObj = {
                        ...project,
                        isTimerRunning: false,
                        completedAt: Date.now()
                    };
                    setCompletedProjects(prev => [finishedObj, ...prev]);
                    setProjects(prev => prev.filter(p => p.id !== pid));
                    
                    if (typeof confetti === 'function') {
                        confetti({ particleCount: 120, spread: 100, origin: { y: 0.5 } });
                    }
                    setFeedback('🏆 Проект успешно завершен!');
                    setTimeout(() => setFeedback(''), 2500);
                });
            };

            const handleAudioUpload = (e) => {
                if (!proStatus.isPro) {
                    setIsProModalOpen(true);
                    return;
                }
                const files = Array.from(e.target.files);
                if (files.length > 0) {
                    const newTracks = files.map(file => ({
                        id: Date.now() + Math.random(),
                        name: file.name,
                        url: URL.createObjectURL(file)
                    }));
                    
                    setPlaylist(prev => {
                        const updated = [...prev, ...newTracks];
                        if (prev.length === 0) {
                            setCurrentTrackIndex(0);
                            setIsPlaying(true);
                            setTimeout(() => {
                                if (audioRef.current) {
                                    audioRef.current.src = newTracks[0].url;
                                    audioRef.current.play().catch(err => console.log(err));
                                }
                            }, 50);
                        }
                        return updated;
                    });
                }
                e.target.value = '';
            };

            const togglePlayback = () => {
                if (!audioRef.current) return;
                if (isPlaying) {
                    audioRef.current.pause();
                    setIsPlaying(false);
                } else {
                    audioRef.current.play().catch(err => console.log(err));
                    setIsPlaying(true);
                }
            };

            const toggleLoopMode = () => {
                setLoopMode(prev => {
                    if (prev === 'none') return 'all';
                    if (prev === 'all') return 'one';
                    return 'none';
                });
            };

            const processPayment = (days, planName) => {
                const expiresAt = Date.now() + (days * 24 * 60 * 60 * 1000);
                setProStatus({
                    isPro: true,
                    expiresAt,
                    plan: planName
                });
                setIsProModalOpen(false);
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 100, spread: 90, origin: { y: 0.5 } });
                }
                setFeedback(`🎉 PRO активирован на ${planName}!`);
                setTimeout(() => setFeedback(''), 3000);
            };

            const formatTime = (s) => {
                const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
                return `${h>0?h+':':''}${m < 10 && h > 0 ? '0' + m : m}:${sec < 10 ? '0' + sec : sec}`;
            };

            const formatDaysSpent = (totalSeconds) => {
                const totalHours = totalSeconds / 3600;
                const days = totalHours / 24;
                if (days < 1) {
                    return `${Math.round(totalHours * 10) / 10} ч.`;
                }
                return `${Math.round(days * 10) / 10} дн. (${Math.floor(totalHours)} ч.)`;
            };

            // Расчет плотности вязания
            const calcStitchesPerCm = gaugeWidthSample > 0 ? gaugeStitchesSample / gaugeWidthSample : 0;
            const calcRowsPerCm = gaugeHeightSample > 0 ? gaugeRowsSample / gaugeHeightSample : 0;
            const targetStitchesNeeded = Math.round(desiredWidth * calcStitchesPerCm);
            const targetRowsNeeded = Math.round(desiredHeight * calcRowsPerCm);

            return (
                <div className="min-h-screen max-w-md mx-auto flex flex-col pb-24 relative">
                    
                    <audio 
                        ref={audioRef} 
                        src={playlist[currentTrackIndex]?.url || null} 
                        className="hidden" 
                        onPlay={() => setIsPlaying(true)}
                        onPause={() => setIsPlaying(false)}
                        onEnded={handleTrackEnded}
                        autoPlay
                    />

                    {/* HEADER */}
                    <header className="sticky top-0 z-50 glass p-5 flex justify-between items-center border-b border-rose-100 shadow-sm">
                        <div className="flex items-center gap-3">
                            <span className="text-3xl">🧶</span>
                            <div>
                                <div className="flex items-center gap-1.5">
                                    <h1 className="text-xl font-black text-rose-600 leading-none tracking-tighter">Вязалочка PRO</h1>
                                    {proStatus.isPro && (
                                        <span className="bg-amber-400 text-amber-950 text-[9px] font-black px-2 py-0.5 rounded-full flex items-center gap-0.5 shadow-sm">

                                                        <div>
                                                            <p className="text-[9px] font-black text-gray-300 uppercase">Рядов</p>
                                                            <p className="text-xs font-black text-rose-600 mt-0.5">{totalRows}</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    ) : (
                                        <div className="text-center py-12 text-gray-400 font-bold text-xs">
                                            Пока нет завершённых проектов. Закончите свой первый проект, чтобы увидеть подробную статистику! ✨
                                        </div>
                                    )}
                                </div>

                                <button 
                                    onClick={() => setIsArchiveModalOpen(false)}
                                    className="w-full mt-4 py-3 bg-gray-100 text-gray-500 rounded-2xl font-bold text-xs uppercase tracking-wider flex-shrink-0"
                                >
                                    Закрыть
                                </button>
                            </div>
                        </div>
                    )}

                    {/* МОДАЛКА ОПЛАТЫ PRO */}
                    {isProModalOpen && (
                        <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-rose-950/60 backdrop-blur-md">
                            <div className="bg-white w-full max-w-sm rounded-[40px] p-6 shadow-2xl card-anim border border-amber-200">
                                <div className="text-center mb-6">
                                    <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-3xl mx-auto flex items-center justify-center mb-3 shadow-inner">
                                        <Icons.Crown />
                                    </div>
                                    <h2 className="text-2xl font-black text-gray-800 tracking-tight">Вязалочка PRO ✨</h2>
                                    <p className="text-xs text-gray-400 font-bold mt-1">Откройте калькулятор плотности, голосовое управление, плеер и безлимит проектов!</p>
                                </div>

                                <div className="space-y-3 mb-6">
                                    <div 
                                        onClick={() => processPayment(1, '1 день (Турбо)')}
                                        className="p-4 rounded-3xl border-2 border-rose-100 hover:border-rose-500 hover:bg-rose-50/50 transition cursor-pointer flex justify-between items-center group"
                                    >
                                        <div>
                                            <p className="font-black text-sm text-gray-800 group-hover:text-rose-600">⚡ 1 день</p>
                                            <p className="text-[10px] text-gray-400 font-bold uppercase">Идеально на выходные</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-lg font-black text-rose-600">99 ₽</span>
                                        </div>
                                    </div>

                                    <div 
                                        onClick={() => processPayment(7, '7 дней (Неделя)')}
                                        className="p-4 rounded-3xl border-2 border-rose-100 hover:border-rose-500 hover:bg-rose-50/50 transition cursor-pointer flex justify-between items-center group"
                                    >
                                        <div>
                                            <p className="font-black text-sm text-gray-800 group-hover:text-rose-600">🧶 7 дней</p>
                                            <p className="text-[10px] text-gray-400 font-bold uppercase">Хит для больших изделий</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-lg font-black text-rose-600">299 ₽</span>
                                        </div>
                                    </div>

                                    <div 
                                        onClick={() => processPayment(30, '30 дней (Месяц)')}
                                        className="p-4 rounded-3xl border-2 border-amber-300 bg-amber-50/50 hover:bg-amber-100/50 transition cursor-pointer flex justify-between items-center relative overflow-hidden group shadow-sm"
                                    >
                                        <span className="absolute top-0 right-0 bg-amber-500 text-white text-[8px] font-black px-3 py-1 rounded-bl-xl uppercase tracking-wider">Выгода 30%</span>
                                        <div>
                                            <p className="font-black text-sm text-amber-900">👑 30 дней</p>
                                            <p className="text-[10px] text-amber-700 font-bold uppercase">Для настоящих мастериц</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-lg font-black text-amber-800">699 ₽</span>
                                        </div>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setIsProModalOpen(false)}
                                    className="w-full py-3 bg-gray-100 text-gray-500 rounded-2xl font-bold text-xs uppercase tracking-wider"
                                >
                                    Закрыть
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ДИАЛОГ ПОДТВЕРЖДЕНИЯ */}
                    {confirmModal.isOpen && (
                        <div className="fixed inset-0 z-[130] flex items-center justify-center p-4 bg-rose-950/40 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-xs rounded-[30px] p-6 shadow-2xl text-center card-anim border border-rose-100">
                                <p className="text-lg font-black text-gray-800 mb-6 leading-snug">{confirmModal.title}</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmModal({ isOpen: false, title: '', onConfirm: null })} className="flex-1 py-3 bg-gray-100 text-gray-500 rounded-2xl font-bold">Отмена</button>
                                    <button onClick={confirmModal.onConfirm} className="flex-1 py-3 bg-rose-600 text-white rounded-2xl font-bold shadow-lg shadow-rose-200">Подтвердить</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* МОДАЛКА СОЗДАНИЯ ПРОЕКТА */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 bg-rose-950/40 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-[40px] p-8 shadow-2xl animate-in slide-in-from-bottom duration-300">
                                <h2 className="text-2xl font-black text-gray-800 mb-6 flex items-center gap-2">Новый проект 🧶</h2>
                                <input 
                                    value={newProjName}
                                    onChange={(e) => setNewProjName(e.target.value)}
                                    className="w-full bg-gray-50 border-2 border-gray-100 focus:border-rose-500 rounded-3xl p-5 mb-4 outline-none font-black text-lg" 
                                    placeholder="Название..." 
                                    autoFocus 
                                />
                                <div className="grid grid-cols-2 gap-2 mb-8">
                                    {CATEGORIES.map(c => (
                                        <button 
                                            key={c.id} 
                                            onClick={() => setNewProjCat(c.id)} 
                                            className={`p-4 rounded-3xl border-2 transition flex flex-col items-center gap-1 ${newProjCat === c.id ? 'border-rose-500 bg-rose-50 text-rose-700' : 'border-gray-100 text-gray-600'}`}
                                        >
                                            <span className="text-2xl">{c.icon}</span>
                                            {c.label}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => setIsModalOpen(false)} className="flex-1 py-4 font-black text-gray-400 uppercase text-xs">Отмена</button>
                                    <button onClick={addProject} className="flex-1 py-4 bg-rose-600 text-white rounded-3xl font-black shadow-lg shadow-rose-200 uppercase text-xs tracking-widest">Создать</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AddPartForm = ({ projectId, onAdd }) => {
            const [partName, setPartName] = useState('');
            return (
                <div className="flex gap-2 pt-2">
                    <input 
                        value={partName}
                        onChange={(e) => setPartName(e.target.value)}
                        className="flex-1 bg-white border-2 border-gray-100 rounded-2xl px-4 py-3 text-sm outline-none focus:border-rose-300 font-bold transition-all" 
                        placeholder="Новая деталь (напр. Рукав 2)" 
                    />
                    <button 
                        onClick={() => {
                            if (partName.trim()) {
                                onAdd(projectId, partName);
                                setPartName('');
                            }
                        }} 
                        className="bg-gray-800 text-white px-5 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest"
                    >
                        + Часть
                    </button>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
