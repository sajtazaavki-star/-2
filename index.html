<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вязалочка PRO — Мультиплеер, Таймеры и Удаление деталей</title>
    
    <!-- Подключение библиотек -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap');
        
        body { 
            background-color: #fff1f2; 
            font-family: 'Nunito', sans-serif; 
            touch-action: manipulation;
            overscroll-behavior: none;
            margin: 0;
        }

        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }

        .mic-active {
            animation: pulse-rose 1.5s infinite;
            background-color: #e11d48 !important;
            color: white !important;
        }

        @keyframes pulse-rose {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }

        .timer-blink { animation: blink 2s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        ::-webkit-scrollbar { width: 0px; }

        .card-anim { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pop-up {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: #e11d48;
            color: white;
            padding: 12px 30px;
            border-radius: 99px;
            font-weight: 900;
            box-shadow: 0 10px 25px rgba(225, 29, 72, 0.3);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icons = {
            Plus: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Mic: () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>,
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            TrashMini: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Play: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Pause: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>,
            Check: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Music: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>,
            Loop: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>,
            SkipForward: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" strokeWidth="3" strokeLinecap="round"></line></svg>,
            SkipBack: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" strokeWidth="3" strokeLinecap="round"></line></svg>,
            Clock: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        };

        const CATEGORIES = [
            { id: 'socks', label: 'Носки', icon: '🧦' },
            { id: 'hats', label: 'Шапки', icon: '🧶' },
            { id: 'clothing', label: 'Одежда', icon: '🧥' },
            { id: 'other', label: 'Разное', icon: '✨' },
        ];

        // Допустимые расширения файлов для максимально широкого выбора на мобильных устройствах
        const ALLOWED_FORMATS = "audio/*,video/*,.mp3,.wav,.m4a,.aac,.ogg,.mp4,.mov,.mkv,.avi,.3gp,audio/mpeg,audio/mp3,audio/wav,audio/x-m4a,video/mp4";

        const App = () => {
            const [projects, setProjects] = useState(() => {
                const saved = localStorage.getItem('knit_app_final_v11');
                const parsed = saved ? JSON.parse(saved) : [];
                // Защитная инициализация для предотвращения крашей при добавлении новых полей таймеров деталей
                return parsed.map(p => ({
                    ...p,
                    timeSpent: p.timeSpent || 0,
                    isTimerRunning: p.isTimerRunning || false,
                    counters: (p.counters || []).map(c => ({
                        ...c,
                        timeSpent: c.timeSpent || 0,
                        isTimerRunning: c.isTimerRunning || false
                    }))
                }));
            });
            
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isListening, setIsListening] = useState(false);
            const [feedback, setFeedback] = useState('');
            
            // Плеер (плейлист)
            const [isPlayerOpen, setIsPlayerOpen] = useState(false);
            const [playlist, setPlaylist] = useState([]);
            const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [loopMode, setLoopMode] = useState('none'); // 'none' | 'all' | 'one'
            
            // Настройка диалогового окна подтверждения
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', onConfirm: null });

            const audioRef = useRef(null);
            const projectsRef = useRef(projects);
            const isListeningRef = useRef(isListening);

            useEffect(() => { 
                projectsRef.current = projects; 
                localStorage.setItem('knit_app_final_v11', JSON.stringify(projects));
            }, [projects]);

            useEffect(() => { isListeningRef.current = isListening; }, [isListening]);

            // Единый интервал для всех таймеров (Общих и Детальных)
            useEffect(() => {
                const interval = setInterval(() => {
                    setProjects(prev => prev.map(p => {
                        let updated = { ...p };
                        // Тикаем общий таймер проекта
                        if (p.isTimerRunning) {
                            updated.timeSpent = (p.timeSpent || 0) + 1;
                        }
                        // Тикаем таймеры деталей внутри проекта
                        updated.counters = p.counters.map(c => {
                            if (c.isTimerRunning && !c.isFinished) {
                                return { ...c, timeSpent: (c.timeSpent || 0) + 1 };
                            }
                            return c;
                        });
                        return updated;
                    }));
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            // Показ кастомного диалогового окна вместо confirm()
            const showConfirm = (title, onConfirmAction) => {
                setConfirmModal({
                    isOpen: true,
                    title,
                    onConfirm: () => {
                        onConfirmAction();
                        setConfirmModal({ isOpen: false, title: '', onConfirm: null });
                    }
                });
            };

            // Автоматическое переключение треков при завершении
            const handleTrackEnded = () => {
                if (playlist.length === 0) return;
                
                if (loopMode === 'one') {
                    if (audioRef.current) {
                        audioRef.current.currentTime = 0;
                        audioRef.current.play().catch(e => console.log(e));
                    }
                } else if (loopMode === 'all') {
                    const nextIndex = (currentTrackIndex + 1) % playlist.length;
                    playTrack(nextIndex);
                } else {
                    const nextIndex = currentTrackIndex + 1;
                    if (nextIndex < playlist.length) {
                        playTrack(nextIndex);
                    } else {
                        setIsPlaying(false);
                    }
                }
            };

            const playTrack = (index) => {
                if (playlist.length === 0 || !playlist[index]) return;
                setCurrentTrackIndex(index);
                setIsPlaying(true);
                setTimeout(() => {
                    if (audioRef.current) {
                        audioRef.current.src = playlist[index].url;
                        audioRef.current.play().catch(err => {
                            console.log("Автозапуск заблокирован или файл поврежден:", err);
                        });
                    }
                }, 50);
            };

            const skipForward = () => {
                if (playlist.length === 0) return;
                const nextIndex = (currentTrackIndex + 1) % playlist.length;
                playTrack(nextIndex);
            };

            const skipBackward = () => {
                if (playlist.length === 0) return;
                const prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
                playTrack(prevIndex);
            };

            const removeTrack = (id, index) => {
                setPlaylist(prev => {
                    const updated = prev.filter(t => t.id !== id);
                    if (currentTrackIndex === index) {
                        if (updated.length === 0) {
                            setIsPlaying(false);
                            if (audioRef.current) audioRef.current.src = "";
                        } else {
                            const nextIdx = index >= updated.length ? 0 : index;
                            setCurrentTrackIndex(nextIdx);
                            setTimeout(() => {
                                if (audioRef.current && updated[nextIdx]) {
                                    audioRef.current.src = updated[nextIdx].url;
                                    if (isPlaying) audioRef.current.play().catch(e => console.log(e));
                                }
                            }, 50);
                        }
                    } else if (index < currentTrackIndex) {
                        setCurrentTrackIndex(currentTrackIndex - 1);
                    }
                    return updated;
                });
            };

            // Голос
            useEffect(() => {
                if (!('webkitSpeechRecognition' in window)) return;
                const rec = new window.webkitSpeechRecognition();
                rec.continuous = true;
                rec.lang = 'ru-RU';

                rec.onresult = (e) => {
                    const text = e.results[e.results.length - 1][0].transcript.toLowerCase();
                    const trigger = ['дальше', 'плюс', 'ряд', 'еще', 'ещё', 'добавь'].some(k => text.includes(k));
                    
                    if (trigger) {
                        const activeProject = projectsRef.current.find(p => p.counters.some(c => !c.isFinished));
                        if (activeProject) {
                            const activeCounters = activeProject.counters.filter(c => !c.isFinished);
                            const targetC = activeCounters[activeCounters.length - 1];
                            if (targetC) {
                                updateCount(activeProject.id, targetC.id, 1);
                                setFeedback('+1 ряд!');
                                setTimeout(() => setFeedback(''), 1500);
                            }
                        }
                    }
                };
                rec.onend = () => { if (isListeningRef.current) try { rec.start(); } catch(e) {} };
                window.recognition = rec;
            }, []);

            const toggleMic = () => {
                if (!window.recognition) return;
                if (isListening) { window.recognition.stop(); setIsListening(false); }
                else { window.recognition.start(); setIsListening(true); }
            };

            const updateCount = (pid, cid, delta) => {
                setProjects(prev => prev.map(p => {
                    if (p.id === pid) {
                        const newC = p.counters.map(c => {
                            if (c.id === cid) {
                                const val = Math.max(0, c.count + delta);
                                if (delta > 0 && val > 0 && val % 10 === 0) confetti({ particleCount: 20, origin: { y: 0.8 } });
                                return { ...c, count: val };
                            }
                            return c;
                        });
                        return { ...p, counters: newC };
                    }
                    return p;
                }));
            };

            const finishCounter = (pid, cid) => {
                setProjects(prev => prev.map(p => {
                    if (p.id === pid) {
                        return { ...p, counters: p.counters.map(c => c.id === cid ? { ...c, isFinished: true, isTimerRunning: false } : c) };
                    }
                    return p;
                }));
                confetti({ particleCount: 40, spread: 70, origin: { y: 0.8 } });
            };

            // Кастомное безопасное удаление отдельной детали
            const deletePart = (pid, cid) => {
                showConfirm("Вы уверены, что хотите удалить эту деталь?", () => {
                    setProjects(prev => prev.map(p => {
                        if (p.id === pid) {
                            return {
                                ...p,
                                counters: p.counters.filter(c => c.id !== cid)
                            };
                        }
                        return p;
                    }));
                });
            };

            const addProject = (name, cat) => {
                const newP = {
                    id: Date.now(),
                    name,
                    category: cat,
                    timeSpent: 0,
                    isTimerRunning: false,
                    counters: [{ id: Date.now(), name: 'Основной этап', count: 0, isFinished: false, timeSpent: 0, isTimerRunning: false }]
                };
                setProjects(prev => [newP, ...prev]);
                setIsModalOpen(false);
            };

            const addPart = (pid, name) => {
                if (!name) return;
                setProjects(prev => prev.map(p => 
                    p.id === pid ? { ...p, counters: [...p.counters, { id: Date.now(), name, count: 0, isFinished: false, timeSpent: 0, isTimerRunning: false }] } : p
                ));
            };

            // Кастомное безопасное удаление всего проекта
            const deleteP = (id) => {
                showConfirm("Удалить проект целиком со всеми деталями?", () => {
                    setProjects(prev => prev.filter(p => p.id !== id));
                });
            };

            // Загрузка музыки/видео (мультивыбор)
            const handleAudioUpload = (e) => {
                const files = Array.from(e.target.files);
                if (files.length > 0) {
                    const newTracks = files.map(file => ({
                        id: Date.now() + Math.random(),
                        name: file.name,
                        url: URL.createObjectURL(file)
                    }));
                    
                    setPlaylist(prev => {
                        const updated = [...prev, ...newTracks];
                        // Если плейлист был пустым, сразу запускаем первый загруженный трек
                        if (prev.length === 0) {
                            setCurrentTrackIndex(0);
                            setIsPlaying(true);
                            setTimeout(() => {
                                if (audioRef.current) {
                                    audioRef.current.src = newTracks[0].url;
                                    audioRef.current.play().catch(err => console.log(err));
                                }
                            }, 50);
                        }
                        return updated;
                    });
                }
                e.target.value = '';
            };

            const togglePlayback = () => {
                if (!audioRef.current) return;
                if (isPlaying) {
                    audioRef.current.pause();
                    setIsPlaying(false);
                } else {
                    audioRef.current.play().catch(err => console.log("Ошибка воспроизведения:", err));
                    setIsPlaying(true);
                }
            };

            const toggleLoopMode = () => {
                setLoopMode(prev => {
                    if (prev === 'none') return 'all';
                    if (prev === 'all') return 'one';
                    return 'none';
                });
            };

            const formatTime = (s) => {
                const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
                return `${h>0?h+':':''}${m < 10 && h > 0 ? '0' + m : m}:${sec < 10 ? '0' + sec : sec}`;
            };

            return (
                <div className="min-h-screen max-w-md mx-auto flex flex-col pb-24 relative">
                    
                    {/* ТЕГ АУДИО */}
                    <audio 
                        ref={audioRef} 
                        src={playlist[currentTrackIndex]?.url || null} 
                        className="hidden" 
                        onPlay={() => setIsPlaying(true)}
                        onPause={() => setIsPlaying(false)}
                        onEnded={handleTrackEnded}
                        autoPlay
                    />

                    {/* HEADER */}
                    <header className="sticky top-0 z-50 glass p-5 flex justify-between items-center border-b border-rose-100 shadow-sm">
                        <div className="flex items-center gap-3">
                            <span className="text-3xl">🧶</span>
                            <div>
                                <h1 className="text-xl font-black text-rose-600 leading-none tracking-tighter">Вязалочка PRO</h1>
                                <p className="text-[10px] font-bold text-rose-300 uppercase mt-1 tracking-widest flex items-center gap-1">
                                    <span className="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> Сохранение активно
                                </p>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button 
                                onClick={() => setIsPlayerOpen(!isPlayerOpen)}
                                className={`p-4 rounded-full transition-all border relative ${isPlayerOpen ? 'bg-rose-600 text-white border-rose-600' : 'bg-white text-rose-300 border-rose-100 shadow-sm'}`}
                            >
                                <Icons.Music />
                                {/* Индикатор активного фонового проигрывания */}
                                {isPlaying && (
                                    <span className="absolute top-1 right-1 flex h-2.5 w-2.5">
                                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                                        <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-600"></span>
                                    </span>
                                )}
                            </button>
                            <button onClick={toggleMic} className={`p-4 rounded-full transition-all duration-300 ${isListening ? 'mic-active' : 'bg-white text-rose-300 border border-rose-100 shadow-sm'}`}>
                                <Icons.Mic />
                            </button>
                        </div>
                    </header>

                    {/* MUSIC PLAYER PANEL WITH PLAYLIST & MULTI-UPLOAD */}
                    {isPlayerOpen && (
                        <div className="sticky top-[81px] z-40 bg-white border-b border-rose-100 p-5 shadow-lg animate-in slide-in-from-top duration-300">
                            <div className="flex flex-col gap-3">
                                <div className="flex items-center justify-between">
                                    <span className="text-[10px] font-black text-gray-400 uppercase tracking-widest">Аудио-фон (Плейлист)</span>
                                    <button onClick={() => setIsPlayerOpen(false)} className="text-rose-500 font-bold text-xs">Скрыть панель</button>
                                </div>
                                
                                <div className="bg-rose-50/50 border border-rose-100 rounded-3xl p-4">
                                    {playlist.length > 0 ? (
                                        <div className="space-y-3">
                                            {/* Контроллер трека */}
                                            <div className="flex items-center gap-2 justify-between">
                                                <div className="flex gap-2">
                                                    <button onClick={skipBackward} className="p-2 bg-white text-rose-600 rounded-xl border border-rose-100 active:scale-90 transition">
                                                        <Icons.SkipBack />
                                                    </button>
                                                    <button 
                                                        onClick={togglePlayback}
                                                        className="w-10 h-10 bg-rose-600 text-white rounded-xl flex items-center justify-center shadow-lg active:scale-90 transition"
                                                    >
                                                        {isPlaying ? <Icons.Pause /> : <Icons.Play />}
                                                    </button>
                                                    <button onClick={skipForward} className="p-2 bg-white text-rose-600 rounded-xl border border-rose-100 active:scale-90 transition">
                                                        <Icons.SkipForward />
                                                    </button>
                                                </div>

                                                {/* Кнопка зацикливания */}
                                                <button 
                                                    onClick={toggleLoopMode}
                                                    className={`p-2 px-3 rounded-xl border font-bold text-[10px] tracking-wider transition-all flex items-center gap-1 ${loopMode !== 'none' ? 'bg-rose-600 text-white border-rose-600' : 'bg-white text-rose-400 border-rose-100'}`}
                                                >
                                                    <Icons.Loop />
                                                    {loopMode === 'none' && "БЕЗ ПОВТОРА"}
                                                    {loopMode === 'all' && "ПОВТОР: ВСЕ"}
                                                    {loopMode === 'one' && "ПОВТОР: ОДИН"}
                                                </button>
                                            </div>

                                            {/* Текущий трек */}
                                            <div className="p-3 bg-white rounded-2xl border border-rose-50 flex items-center justify-between">
                                                <div className="min-w-0 flex-1">
                                                    <p className="text-xs font-black text-rose-600 truncate">▶ {playlist[currentTrackIndex]?.name}</p>
                                                    <p className="text-[9px] font-bold text-gray-400 uppercase mt-0.5">Трек {currentTrackIndex + 1} из {playlist.length}</p>
                                                </div>
                                            </div>

                                            {/* Список очереди */}
                                            <div className="max-h-32 overflow-y-auto space-y-1.5 pr-1 mt-2 border-t border-rose-100 pt-3">
                                                {playlist.map((track, idx) => (
                                                    <div 
                                                        key={track.id} 
                                                        className={`flex items-center justify-between p-2 rounded-xl text-xs transition-all ${idx === currentTrackIndex ? 'bg-rose-100/70 font-bold text-rose-700' : 'bg-white/60 text-gray-600 hover:bg-rose-50/50'}`}
                                                    >
                                                        <span 
                                                            onClick={() => playTrack(idx)} 
                                                            className="flex-1 truncate cursor-pointer pr-2"
                                                        >
                                                            {idx + 1}. {track.name}
                                                        </span>
                                                        <button 
                                                            onClick={() => removeTrack(track.id, idx)} 
                                                            className="text-gray-300 hover:text-rose-600 p-1"
                                                        >
                                                            ✕
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-center py-4 text-xs font-bold text-rose-400">
                                            Плейлист пуст. Выберите треки ниже! 👇
                                        </div>
                                    )}

                                    {/* Кнопка добавления треков */}
                                    <label className="mt-3 flex items-center justify-center bg-white border-2 border-dashed border-rose-200 rounded-2xl p-4 hover:bg-rose-50 transition cursor-pointer">
                                        <span className="text-xl mr-2">🎶</span>
                                        <span className="text-xs font-black text-rose-500 uppercase tracking-wider">Выбрать файлы (можно несколько)</span>
                                        <input type="file" accept={ALLOWED_FORMATS} className="hidden" onChange={handleAudioUpload} multiple />
                                    </label>
                                </div>
                            </div>
                        </div>
                    )}

                    {feedback && <div className="pop-up">{feedback}</div>}

                    {/* MAIN LIST */}
                    <main className="p-4 space-y-6">
                        {projects.map(p => {
                            const activeRows = p.counters.filter(c => !c.isFinished).reduce((a, b) => a + b.count, 0);
                            const finishedC = p.counters.filter(c => c.isFinished);
                            const activeC = p.counters.filter(c => !c.isFinished);

                            return (
                                <div key={p.id} className="card-anim bg-white rounded-[40px] shadow-xl shadow-rose-200/20 border-2 border-rose-50 overflow-hidden">
                                    
                                    {/* Шапка проекта с общим таймером */}
                                    <div className="p-6 bg-rose-50/40 border-b border-rose-50">
                                        <div className="flex justify-between items-start mb-2">
                                            <div className="flex items-center gap-1.5 flex-wrap">
                                                <span className="text-[10px] font-black bg-white text-rose-500 px-3 py-1 rounded-full border border-rose-100 uppercase">
                                                    {CATEGORIES.find(c => c.id === p.category)?.label}
                                                </span>
                                                
                                                {/* Общий таймер проекта */}
                                                <button 
                                                    onClick={() => setProjects(prev => prev.map(x => x.id === p.id ? {...x, isTimerRunning: !x.isTimerRunning} : x))} 
                                                    className={`flex items-center gap-1 px-3 py-1 rounded-full text-[10px] font-black border transition-all ${p.isTimerRunning ? 'bg-rose-500 text-white border-rose-500 timer-blink' : 'bg-white text-gray-400 border-gray-100 shadow-sm'}`}
                                                    title="Общий таймер всего проекта"
                                                >
                                                    {p.isTimerRunning ? <Icons.Pause /> : <Icons.Play />} 
                                                    <span className="ml-1 uppercase tracking-tighter">ОБЩИЙ:</span> {formatTime(p.timeSpent || 0)}
                                                </button>
                                            </div>
                                            <button onClick={() => deleteP(p.id)} className="text-rose-100 hover:text-rose-600 transition-colors p-2"><Icons.Trash /></button>
                                        </div>
                                        <div className="flex justify-between items-end">
                                            <h2 className="text-2xl font-black text-gray-800 leading-tight tracking-tight max-w-[65%]">{p.name}</h2>
                                            <div className="text-right">
                                                <div className="text-2xl font-black text-rose-600">{activeRows}</div>
                                                <p className="text-[9px] font-black text-rose-300 uppercase tracking-widest">Рядов в работе</p>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Детали/Части с индивидуальными таймерами */}
                                    <div className="p-6 space-y-5">
                                        {activeC.map(c => (
                                            <div key={c.id} className="bg-gray-50/80 rounded-3xl p-5 border border-gray-100">
                                                <div className="flex justify-between items-start mb-2">
                                                    <div className="flex items-center gap-2">
                                                        <p className="text-[11px] font-black text-gray-400 uppercase tracking-widest">{c.name}</p>
                                                        {/* Кнопка быстрого удаления активной детали */}
                                                        <button 
                                                            onClick={() => deletePart(p.id, c.id)} 
                                                            className="text-gray-300 hover:text-rose-500 transition-colors p-1"
                                                            title="Удалить эту деталь"
                                                        >
                                                            <Icons.TrashMini />
                                                        </button>
                                                    </div>
                                                    
                                                    {/* Таймер конкретной детали */}
                                                    <button
                                                        onClick={() => {
                                                            setProjects(prev => prev.map(x => {
                                                                if (x.id === p.id) {
                                                                    return {
                                                                        ...x,
                                                                        counters: x.counters.map(cnt => cnt.id === c.id ? { ...cnt, isTimerRunning: !cnt.isTimerRunning } : cnt)
                                                                    };
                                                                }
                                                                return x;
                                                            }));
                                                        }}
                                                        className={`flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[9px] font-bold border transition-all ${c.isTimerRunning ? 'bg-rose-600 text-white border-rose-600 timer-blink' : 'bg-white text-rose-400 border-rose-100'}`}
                                                        title="Таймер этой детали"
                                                    >
                                                        <Icons.Clock />
                                                        <span className="ml-0.5 tracking-tighter">{formatTime(c.timeSpent || 0)}</span>
                                                        {c.isTimerRunning ? <span className="ml-1">⏸</span> : <span className="ml-1">▶</span>}
                                                    </button>
                                                </div>

                                                <div className="flex justify-between items-center mb-4">
                                                    <span className="text-[10px] text-gray-300 font-bold uppercase tracking-wider">Этап</span>
                                                    <div className="text-4xl font-black text-rose-600 tabular-nums">{c.count}</div>
                                                </div>

                                                <div className="flex gap-2 mb-4">
                                                    <button onClick={() => updateCount(p.id, c.id, -1)} className="w-14 h-14 bg-white rounded-2xl border border-gray-100 text-gray-400 font-bold active:bg-gray-100 transition shadow-sm text-2xl flex items-center justify-center">−</button>
                                                    <button onClick={() => updateCount(p.id, c.id, 2)} className="flex-1 h-14 bg-rose-100 text-rose-600 rounded-2xl font-black text-[10px] border-2 border-rose-200 active:scale-95 transition uppercase tracking-widest">+2 ряда</button>
                                                    <button onClick={() => updateCount(p.id, c.id, 1)} className="w-16 h-14 bg-rose-600 text-white rounded-2xl font-bold flex items-center justify-center active:scale-95 transition shadow-lg shadow-rose-200">
                                                        <Icons.Plus />
                                                    </button>
                                                </div>
                                                <button 
                                                    onClick={() => finishCounter(p.id, c.id)}
                                                    className="w-full py-3 bg-white border border-rose-100 rounded-xl text-[10px] font-black text-rose-400 uppercase tracking-widest flex items-center justify-center gap-2 hover:bg-rose-50 transition"
                                                >
                                                    <Icons.Check /> Закончить деталь
                                                </button>
                                            </div>
                                        ))}

                                        {/* Добавить часть */}
                                        <div className="flex gap-2 pt-2">
                                            <input id={`in-${p.id}`} className="flex-1 bg-white border-2 border-gray-100 rounded-2xl px-4 py-3 text-sm outline-none focus:border-rose-300 font-bold transition-all" placeholder="Новая деталь (напр. Рукав 2)" />
                                            <button onClick={() => { const el = document.getElementById(`in-${p.id}`); if(el.value) { addPart(p.id, el.value); el.value = ''; } }} className="bg-gray-800 text-white px-5 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest">+ Часть</button>
                                        </div>

                                        {/* Завершенные части с зафиксированным временем */}
                                        {finishedC.length > 0 && (
                                            <div className="mt-6 pt-6 border-t border-dashed border-gray-200">
                                                <p className="text-[10px] font-black text-gray-300 uppercase tracking-widest mb-3">Завершенные детали:</p>
                                                <div className="space-y-2">
                                                    {finishedC.map(fc => (
                                                        <div key={fc.id} className="flex justify-between items-center bg-gray-50/40 px-4 py-2.5 rounded-2xl border border-gray-100">
                                                            <div className="flex items-center gap-2 min-w-0 flex-1">
                                                                <span className="text-emerald-500 flex-shrink-0"><Icons.Check /></span>
                                                                <span className="text-xs font-bold text-gray-500 truncate">{fc.name}</span>
                                                            </div>
                                                            <div className="flex items-center gap-3 ml-2 flex-shrink-0">
                                                                <div className="text-right">
                                                                    <p className="text-xs font-black text-gray-400">{fc.count} ряд.</p>
                                                                    <p className="text-[8px] font-bold text-gray-300 uppercase flex items-center gap-0.5 justify-end">
                                                                        <Icons.Clock /> {formatTime(fc.timeSpent || 0)}
                                                                    </p>
                                                                </div>
                                                                {/* Кнопка удаления завершенной детали */}
                                                                <button 
                                                                    onClick={() => deletePart(p.id, fc.id)} 
                                                                    className="text-gray-300 hover:text-rose-500 transition-colors p-1"
                                                                    title="Удалить деталь из завершенных"
                                                                >
                                                                    ✕
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </main>

                    {/* КНОПКА СОЗДАНИЯ ПРОЕКТА */}
                    <button onClick={() => setIsModalOpen(true)} className="fixed bottom-8 right-8 w-16 h-16 bg-rose-600 text-white rounded-full shadow-2xl flex items-center justify-center active:scale-90 transition-transform z-40 border-4 border-white shadow-rose-300">
                        <Icons.Plus />
                    </button>

                    {/* КРАСИВОЕ ДИАЛОГОВОЕ ОКНО ПОДТВЕРЖДЕНИЯ УДАЛЕНИЯ (ЗАМЕНА SYSTEM CONFIRM) */}
                    {confirmModal.isOpen && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-rose-950/40 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-xs rounded-[30px] p-6 shadow-2xl text-center card-anim border border-rose-100">
                                <p className="text-lg font-black text-gray-800 mb-6 leading-snug">{confirmModal.title}</p>
                                <div className="flex gap-3">
                                    <button
                                        onClick={() => setConfirmModal({ isOpen: false, title: '', onConfirm: null })}
                                        className="flex-1 py-3 bg-gray-100 text-gray-500 rounded-2xl font-bold hover:bg-gray-200 active:scale-95 transition"
                                    >
                                        Отмена
                                    </button>
                                    <button
                                        onClick={confirmModal.onConfirm}
                                        className="flex-1 py-3 bg-rose-600 text-white rounded-2xl font-bold hover:bg-rose-700 active:scale-95 transition shadow-lg shadow-rose-200"
                                    >
                                        Удалить
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Модалка создания проекта */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 bg-rose-950/40 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-[40px] p-8 shadow-2xl animate-in slide-in-from-bottom duration-300">
                                <h2 className="text-2xl font-black text-gray-800 mb-6 flex items-center gap-2">Новый проект 🧶</h2>
                                <input id="pn-input" className="w-full bg-gray-50 border-2 border-gray-100 focus:border-rose-500 rounded-3xl p-5 mb-4 outline-none font-black text-lg" placeholder="Название..." autoFocus />
                                <div className="grid grid-cols-2 gap-2 mb-8">
                                    {CATEGORIES.map(c => (
                                        <button key={c.id} onClick={() => window._activeCat = c.id} className="p-4 rounded-3xl border-2 border-gray-100 focus:border-rose-500 focus:bg-rose-50 text-sm font-black transition flex flex-col items-center gap-1">
                                            <span className="text-2xl">{c.icon}</span>
                                            {c.label}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => setIsModalOpen(false)} className="flex-1 py-4 font-black text-gray-400 uppercase text-xs">Отмена</button>
                                    <button onClick={() => {
                                        const v = document.getElementById('pn-input').value;
                                        if(v) addProject(v, window._activeCat || 'other');
                                    }} className="flex-1 py-4 bg-rose-600 text-white rounded-3xl font-black shadow-lg shadow-rose-200 uppercase text-xs tracking-widest">Создать</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
